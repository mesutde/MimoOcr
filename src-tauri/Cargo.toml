[package]
name = "mimo-ocr-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mimo OCR desktop app (Tauri 2) — Phase 1 Windows alpha"
authors.workspace = true
repository.workspace = true

[lib]
name = "mimo_ocr_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mimo-ocr-core.workspace = true
mimo-ocr-engines.workspace = true
mimo-ocr-capture.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
arboard.workspace = true
base64.workspace = true
image.workspace = true
chrono.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
