[package]
name = "mimo-ocr-engines"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OCR engine adapters for Mimo OCR (mock, Tesseract CLI, Windows OCR, optional)"

[dependencies]
mimo-ocr-core.workspace = true
image.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Globalization",
  "Foundation",
  "Foundation_Collections",
] }

[features]
default = ["cli-tesseract", "windows-ocr"]
cli-tesseract = []
windows-ocr = ["dep:windows"]
leptess = ["dep:leptess"]
rusty-tesseract = ["dep:rusty-tesseract"]

[dependencies.leptess]
version = "0.10"
optional = true

[dependencies.rusty-tesseract]
version = "1.1"
optional = true
