<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Mimo OCR — Bölge seç</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%;
      overflow: hidden; cursor: crosshair;
      background: rgba(0, 0, 0, 0.08);
      user-select: none;
    }
    #rect {
      position: absolute; display: none;
      border: 2px solid #5B8CFF;
      background: rgba(91, 140, 255, 0.15);
      pointer-events: none;
    }
    #hud {
      position: fixed; left: 20px; top: 20px;
      background: rgba(15, 17, 21, 0.92);
      color: #E8EAEF; border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px; padding: 12px 16px;
      font: 13px/1.5 "Segoe UI", sans-serif;
      pointer-events: none; z-index: 10;
      max-width: 360px;
    }
    #size {
      position: fixed; display: none;
      background: #5B8CFF; color: #0b1020;
      font: 12px/1 Consolas, monospace; font-weight: 700;
      padding: 4px 8px; border-radius: 6px;
      pointer-events: none; z-index: 10;
    }
    #crossH, #crossV {
      position: absolute; display: none; pointer-events: none;
      background: rgba(91,140,255,.7); z-index: 5;
    }
    #crossH { height: 1px; left: 0; right: 0; }
    #crossV { width: 1px; top: 0; bottom: 0; }
  </style>
</head>
<body>
  <div id="crossH"></div>
  <div id="crossV"></div>
  <div id="rect"></div>
  <div id="hud">
    <strong>Mimo OCR — Bölge seç</strong><br/>
    Masaüstünde fareyle <strong>bas–sürükle–bırak</strong><br/>
    <span style="color:#9AA1AE">Artı imleç takip eder · Esc = iptal</span><br/>
    <span id="monLabel" style="color:#9AA1AE"></span>
  </div>
  <div id="size"></div>
  <script>
    const rect = document.getElementById("rect");
    const size = document.getElementById("size");
    const crossH = document.getElementById("crossH");
    const crossV = document.getElementById("crossV");
    const monLabel = document.getElementById("monLabel");

    let start = null;
    let current = null;
    let monitorIndex = 0;
    let closed = false;

    const params = new URLSearchParams(window.location.search);
    if (params.has("monitor")) monitorIndex = Number(params.get("monitor") || 0);
    monLabel.textContent =
      "monitör #" + monitorIndex + " · " + window.innerWidth + "×" + window.innerHeight;

    // Failsafe: if something hangs, auto-cancel after 90s.
    setTimeout(() => { if (!closed) cancel(); }, 90000);

    function drawBox(x, y, w, h) {
      rect.style.display = "block";
      rect.style.left = x + "px";
      rect.style.top = y + "px";
      rect.style.width = w + "px";
      rect.style.height = h + "px";
      size.style.display = "block";
      size.style.left = Math.min(window.innerWidth - 80, x + w + 8) + "px";
      size.style.top = Math.min(window.innerHeight - 30, y + h + 8) + "px";
      size.textContent = Math.round(w) + "×" + Math.round(h);
    }

    function updateCross(e) {
      crossH.style.display = "block";
      crossV.style.display = "block";
      crossH.style.top = e.clientY + "px";
      crossV.style.left = e.clientX + "px";
    }

    async function showMain() {
      try {
        await window.__TAURI__.core.invoke("show_main_window");
      } catch (_) {}
    }

    async function closeOverlay() {
      if (closed) return;
      closed = true;
      try {
        // Rust: show main FIRST, then close overlay (app must not vanish).
        await window.__TAURI__.core.invoke("finish_region_pick");
      } catch (e) {
        console.error(e);
        try {
          const win = window.__TAURI__.window.getCurrentWindow();
          await win.close();
        } catch (_) {}
        await showMain();
      }
    }

    async function cancel() {
      if (closed) return;
      closed = true;
      try {
        await window.__TAURI__.event.emit("region-select-cancelled", true);
      } catch (_) {}
      try {
        await window.__TAURI__.core.invoke("cancel_region_pick");
      } catch (e) {
        console.error(e);
        try {
          const win = window.__TAURI__.window.getCurrentWindow();
          await win.close();
        } catch (_) {}
        await showMain();
      }
    }

    async function confirmSelection() {
      if (!current || current.w < 8 || current.h < 8) {
        await cancel();
        return;
      }
      const payload = {
        monitor: monitorIndex,
        x: Math.round(current.x),
        y: Math.round(current.y),
        width: Math.round(current.w),
        height: Math.round(current.h),
        clientW: window.innerWidth || document.documentElement.clientWidth,
        clientH: window.innerHeight || document.documentElement.clientHeight,
      };
      closed = true;
      try {
        // Rust: scale coords → capture crop → OCR → show main → close overlay
        const dto = await window.__TAURI__.core.invoke("complete_live_region_pick", payload);
        console.log("ocr ok", dto && dto.plain_text);
      } catch (e) {
        console.error("complete_live_region_pick failed", e);
        try {
          await window.__TAURI__.event.emit("ocr-error", String(e));
        } catch (_) {}
        try {
          await window.__TAURI__.core.invoke("cancel_region_pick");
        } catch (_) {
          await showMain();
        }
      }
    }

    document.addEventListener("mousemove", (e) => {
      updateCross(e);
      if (!start) return;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      current = { x, y, w, h };
      drawBox(x, y, w, h);
    });

    document.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      start = { x: e.clientX, y: e.clientY };
      current = { x: e.clientX, y: e.clientY, w: 0, h: 0 };
      drawBox(e.clientX, e.clientY, 0, 0);
      updateCross(e);
    });

    document.addEventListener("mouseup", async (e) => {
      if (!start) return;
      const x = Math.min(start.x, e.clientX);
      const y = Math.min(start.y, e.clientY);
      const w = Math.abs(e.clientX - start.x);
      const h = Math.abs(e.clientY - start.y);
      current = { x, y, w, h };
      start = null;
      if (w >= 8 && h >= 8) {
        await confirmSelection();
      }
    });

    document.addEventListener("keydown", async (e) => {
      if (e.key === "Escape") await cancel();
    });

    document.addEventListener("contextmenu", async (e) => {
      e.preventDefault();
      await cancel();
    });
  </script>
</body>
</html>
